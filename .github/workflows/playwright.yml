name: Playwright E2E Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest

    steps:

      # 1. Check out the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Install Python dependencies
      - name: Install dependencies
        working-directory: saucedemo_playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Install Playwright browsers
      - name: Install Playwright Chromium browser
        working-directory: saucedemo_playwright
        run: playwright install chromium --with-deps

      # 5. Run the tests (headless — no display in CI)
      - name: Run E2E Tests
        working-directory: saucedemo_playwright
        run: |
          python -m pytest tests/test_saucedemo_e2e.py \
            -v \
            --headless \
            --html=reports/report.html \
            --self-contained-html

      # 6. Upload the HTML report as a GitHub Actions artifact
      - name: Upload HTML Report
        if: always()   # Upload even if tests fail
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: saucedemo_playwright/reports/report.html
          retention-days: 14

